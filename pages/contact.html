<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="img/png" href="../image_ bracelets/logo1.png">
    <title>PANDORA</title>
</head>

<body>
    <header class="headerCategory">
        <div id="adsContainer" class="adsContainer">
            <p class="ad active">ברוכים הבאים לחנות שלנו!</p> <!-- מודעה ראשונה פעילה -->
        </div><br>
        <a href="../HomePage.html">
            <img src="../image_ bracelets/logo.webp" alt="לוגו שלי" class="logo">
        </a>
        <nav>
            <ul class="categories">
                <li><a href="about.html">אודות</a></li>
                <li><a href="necklaces.html">שרשראות</a></li>
                <li><a href="bracelets.html">צמידים</a></li>
                <li><a href="rings.html">טבעות</a></li>
                <li><a href="earing.html">עגילים</a></li>
                <li><a href="contact.html">יצירת קשר</a></li>
            </ul>
        </nav>
    </header>

    <p>לכל שאלה או בירור אנא מלאו את הטופס הבא :</p>
    <form id="contactForm">
        <table class="responsive-table">
            <tr>
                <td><label for="id">תעודת זהות:</label></td>
                <td><input type="password" id="id" name="id" required placeholder="תעודת זהות"></td>
            </tr>
            <tr>
                <td><label for="fname">שם פרטי:</label></td>
                <td><input type="text" id="fname" name="fname" required placeholder="שם פרטי" maxlength="9"></td>
            </tr>
            <tr>
                <td><label for="lname">שם משפחה:</label></td>
                <td><input type="text" id="lname" name="lname" required placeholder="שם משפחה" maxlength="9"></td>
            </tr>
            <tr>
                <td><label for="mail">דואר אלקטרוני:</label></td>
                <td><input type="email" id="mail" name="mail" required placeholder="דואר אלקטרוני"></td>
            </tr>
            <tr>
                <td><label for="what">מה ברצונך לכתוב לנו?</label></td>
                <td><input type="text" id="what" name="what" required placeholder="מה ברצונך לכתוב לנו?"></td>
            </tr>
            <tr>
                <td><input type="submit" value="שלח" style="width: 100%; background-color: white;"></td>
            </tr>
        </table>
    </form>
    <footer id="footer2">
        <img src="../image earing/footer3.png" alt="footer">
        <img src="../image earing/image2.png" alt="footer">
    </footer>
    <script>
        const ads = [
            "משלוח חינם על כל ההזמנות!",
            "הנחה של 20% על צמידים!",
            "הצעות מיוחדות לחברי המועדון!",
            "אל תפספסו את המבצעים שלנו!",
            "החלפות והחזרות בסניפים שלנו עד יום",
            "החלפות והחזרות בסניפי הרשת",
        ];

        let adIndex = 0;
        const adsContainer = document.getElementById('adsContainer');

        function showNextAd() {
            const currentAd = adsContainer.querySelector('.ad.active');
            currentAd.classList.remove('active');

            adIndex = (adIndex + 1) % ads.length;
            const nextAd = document.createElement('p');
            nextAd.classList.add('ad');
            nextAd.textContent = ads[adIndex];
            adsContainer.appendChild(nextAd);

            // לאחר שהמודעה התווספה, מעביר אותה
            setTimeout(() => {
                nextAd.classList.add('active');
            }, 10); // זמן קצר לפני השינוי

            // מסיר את המודעה הקודמת אחרי האנימציה
            setTimeout(() => {
                currentAd.remove();
            }, 500); // תואם עם זמן האנימציה
        }

        // הוספת קריאה לפונקציה עם setInterval כדי להציג מודעות כל 3 שניות
        setInterval(showNextAd, 3000); // מחליף כל 3 שניות
    </script>
</body>

</html>
