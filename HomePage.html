<!DOCTYPE html>
<html lang="en" dir="rtl">

<head dir="auto">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDORA</title>
    <link rel="stylesheet" href="pages/style.css">
    <link rel="icon" type="img/png" href="image_ bracelets/logo1.png">
</head>
<body>
    <header class="headerCategory">
        <div id="adsContainer" class="adsContainer">
            <p class="ad active">ברוכים הבאים לחנות שלנו!</p>
        </div><br>
        <a href="HomePage.html">
            <img src="image_ bracelets/logo.webp" alt="לוגו שלי" class="logo">
        </a>
        <nav>
            <ul class="categories">
                <li><a href="pages/about.html">אודות</a></li>
                <li><a href="pages/necklaces.html">שרשראות</a></li>
                <li><a href="pages/bracelets.html">צמידים</a></li>
                <li><a href="pages/rings.html">טבעות</a></li>
                <li><a href="pages/earing.html">עגילים</a></li>
                <li><a href="pages/contact.html">יצירת קשר</a></li>
            </ul>
        </nav>
    </header>
    <div id="divhome">
        <img id="imageHome" src="image earing/home.webp" alt="kj">
        <div class="hpDiv">
            <div class="hpDivs">
                <img class="hpImg" src="image necklaces/im4.webp" alt="home">
                <img class="hpImg" src="image rings/img13.webp" alt="home">
                <img class="hpImg" src="image_ bracelets/img8.webp" alt="home">
                <img class="hpImg" src="image earing/img14.webp" alt="home">
                <img class="hpImg" src="image necklaces/img10.webp" alt="home ">
                <img class="hpImg" src="image earing/img12.webp" alt="home">
                <img class="hpImg" src="image rings/img4.webp" alt="home">
                <img class="hpImg" src="image_ bracelets/img6.webp" alt="home">
            </div>
        </div>
    </div>
    <script>
        let currentIndex = 0;
        function showNextSlide() {
            const slides = document.querySelector('.hpDivs');
            const totalSlides = slides.children.length;
            currentIndex = (currentIndex + 1) % totalSlides;
            slides.style.transform = `translateX(-${currentIndex * (100 / totalSlides)}%)`;
        }
        setInterval(showNextSlide, 1000);
    </script>
    <script>
        const ads = [
            "משלוח חינם על כל ההזמנות!",
            "הנחה של 20% על צמידים!",
            "הצעות מיוחדות לחברי המועדון!",
            "אל תפספסו את המבצעים שלנו!",
            "החלפות והחזרות בסניפים שלנו עד יום",
            "החלפות והחזרות בסניפי הרשת",
        ];
        let adIndex = 0;
        const adsContainer = document.getElementById('adsContainer');
        function showNextAd() {
            const currentAd = adsContainer.querySelector('.ad.active');
            currentAd.classList.remove('active');
            adIndex = (adIndex + 1) % ads.length;
            const nextAd = document.createElement('p');
            nextAd.classList.add('ad');
            nextAd.textContent = ads[adIndex];
            adsContainer.appendChild(nextAd);
            // לאחר שהמודעה התווספה, מעביר אותה
            setTimeout(() => {
                nextAd.classList.add('active');
            }, 10); // זמן קצר לפני השינוי
            // מסיר את המודעה הקודמת אחרי האנימציה
            setTimeout(() => {
                currentAd.remove();
            }, 500); // תואם עם זמן האנימציה
        }
        // הוספת קריאה לפונקציה עם setInterval כדי להציג מודעות כל 3 שניות
        setInterval(showNextAd, 3000); // מחליף כל 3 שניות
    </script>
</body>

</html>
